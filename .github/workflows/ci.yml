name: ci

# Least privilege. Default GITHUB_TOKEN is write-scoped for contents on push,
# and no job in this workflow writes (#319).
permissions:
  contents: read

# Cancel superseded runs: six matrix legs per push adds up fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff check (E/F/I/UP baseline, see pyproject [tool.ruff])
        run: uvx ruff@0.16.9 check src tests

      - name: Ruff format check
        run: uvx ruff@0.16.9 format --check src tests

      - name: Mypy baseline (see pyproject [tool.mypy])
        run: uvx mypy@1.10 src/sk/tools src/sk/agent.py src/sk/router.py src/sk/config.py src/sk/store.py src/sk/slash.py src/sk/tui/ src/sk/cli/ src/sk/model_profiles.py src/sk/anthropic_backend.py src/sk/upgrade.py src/sk/init_wizard.py src/sk/mcp_server.py src/sk/keyring.py src/sk/auth.py src/sk/daemon.py src/sk/brief.py src/sk/jobs.py src/sk/plugins.py src/sk/skills.py src/sk/checkpoints.py src/sk/gitdiff.py src/sk/mcp_client.py src/sk/memory_files.py src/sk/trust.py src/sk/egress.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: uv sync --frozen --extra test

      - name: Run tests
        run: uv run pytest tests -q

  test-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Replaces a gate that grepped the README for the collected count. Two
      # problems: any PR that added a test failed it (51 commits exist purely to
      # reconcile one hand-maintained string, duplicated across 7 places), and
      # `grep -oE '[0-9]+' | head -1` on the last line silently extracted a number
      # out of a collection error and passed. Collection must now succeed; the
      # count is reported, not asserted (#319).
      - name: Install package + test extras
        run: uv sync --frozen --extra test

      - name: Collect tests
        run: uv run pytest tests --collect-only -q

  release-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bumps only on release/* branches (see CONTRIBUTING)
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx "src/sk/__init__.py" || exit 0
          case "${{ github.head_ref }}" in
            release/*) echo "version bump on a release branch: ok" ;;
            *) echo "::error::src/sk/__init__.py changed outside a release/* branch — move the bump (CONTRIBUTING: Releases)" && exit 1 ;;
          esac

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test extras
        run: uv sync --frozen --extra test

      - name: Report coverage (informational, not gated)
        run: uv run pytest tests -q --cov=sk --cov-report=term-missing 2>&1 | tail -n 40

  website:
    # The Vite site had no CI at all — no build, no typecheck, no link check —
    # which is how three version copies and a 780-vs-actual test-count claim sat
    # in the tree unnoticed (#323). `tsc -b` is the real gate: it is what caught
    # the missing @types/node here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Verify metadata
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error