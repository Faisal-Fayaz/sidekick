name: release

# Publish to PyPI only when code is merged to main of the canonical repo
# (Faisal-Fayaz/sidekick). Pushes to forks are skipped: GitHub mints the OIDC
# token with the repo_owner that runs the workflow, and the PyPI trusted
# publisher is registered for Faisal-Fayaz/sidekick only — so a fork merge
# simply cannot authenticate to PyPI.
#
# Triggered on `push` to main (fires when a PR is merged), not on the
# pull_request event itself — GitHub does not issue OIDC id-tokens for
# PR workflows that originate from forks.

on:
  push:
    branches: [main]
    paths:
      - "src/sk/__init__.py"
  workflow_dispatch:
    inputs:
      target:
        description: "Which index to publish to (manual runs only)"
        type: choice
        default: testpypi
        options: [testpypi, pypi]
      reconcile:
        description: >
          Recovery: re-tag and (re-)publish the GitHub Release for a version that
          is already on PyPI. Use when a previous run uploaded to PyPI but died
          before creating the tag, which used to be unrecoverable.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'Faisal-Fayaz/sidekick'
    outputs:
      version: ${{ steps.ident.outputs.version }}
      target: ${{ steps.ident.outputs.target }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Identify version + target
        id: ident
        run: |
          VERSION=$(sed -n 's/.*__version__ = "\(.*\)"/\1/p' src/sk/__init__.py)
          TARGET="${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "will publish sidekick-agent $VERSION -> $TARGET"

      - name: Check if version already published
        id: check
        env:
          VERSION: ${{ steps.ident.outputs.version }}
          TARGET: ${{ steps.ident.outputs.target }}
        run: |
          if [ "$TARGET" != "pypi" ]; then
            echo "manual $TARGET run — publishing $VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/sidekick-agent/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "sidekick-agent $VERSION already on PyPI — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "new version $VERSION — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.check.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        if: steps.check.outputs.publish == 'true'
        run: uv build

      - name: Verify metadata
        if: steps.check.outputs.publish == 'true'
        run: uvx twine check dist/*

      - name: Upload artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sidekick-agent
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Trusted publishing — zero stored credentials. Register this repo as a
      # "publishing source" on PyPI: https://pypi.org/manage/account/publishing/
      #   owner   : Faisal-Fayaz  repo  : sidekick  project: sidekick-agent
      #   workflow: release.yml  environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-test:
    name: Publish to Test PyPI
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sidekick-agent
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Same trusted-publishing setup on Test PyPI (its own "publishing source").
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  github-release:
    name: GitHub Release (new version on main only)
    needs: [build, publish]
    # Two ways in, and the second is the one that used to be missing.
    #
    # 1. We just published: needs.publish.result == 'success'.
    # 2. The version is ALREADY on PyPI (needs.build.outputs.publish == 'false').
    #
    # (2) is the recovery path, and the old condition made this job
    # unrecoverable. If the publish succeeded but the "Create tag" step failed,
    # a re-run found the version on PyPI, set publish=false, skipped the
    # `publish` job — and `needs.publish.result` was then 'skipped', not
    # 'success', so github-release was skipped too. Forever: PyPI had the
    # release, the repo had no tag and no GitHub Release, and the only manual
    # escape was pushing a tag, which no workflow validates. `reconcile` above
    # makes the same path reachable by hand.
    if: >-
      (github.event_name == 'push'
        && (needs.publish.result == 'success' || needs.build.outputs.publish == 'false'))
      || (github.event_name == 'workflow_dispatch'
        && inputs.reconcile == 'true'
        && needs.build.outputs.target == 'pypi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # No-op on the recovery path: the version is already on PyPI, so nothing
      # was built and there is nothing to download. Tolerated rather than
      # required, because requiring it is what made the recovery unreachable.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dist
          path: dist

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.build.outputs.version }}"
          if git show-ref --tags | grep -q "refs/tags/$TAG$"; then
            echo "tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true