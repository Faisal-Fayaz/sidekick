name: smoke

# Per-release install smoke test (#443).
#
# The release workflow publishes to PyPI. That is not the same as "a user can
# install it and use it": a broken wheel, a missing dependency, or a stale AUR
# pin only shows up when somebody tries.
#
# This job installs the published artifact the way a user would and uses it.
# It runs when the release workflow finishes, and on demand for any version.
#
# The AUR package itself is built and installed by the AUR, not here — but the
# pin it is built from has to be right, so the pin is checked against what
# PyPI actually published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to smoke (e.g. 0.33.0). Empty = the pin in the AUR PKGBUILD."
        required: false
        default: ""
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # A release that failed has nothing to smoke; the dispatch path always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version to smoke
        id: version
        run: |
          # The version that was released, not the version the AUR pin names:
          # the pin is what this job checks, not what it reads.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/.*__version__ = "\(.*\)"/\1/p' src/sk/__init__.py)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::no version to smoke"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "smoking $VERSION"

      # The install is the point: a fresh environment, the published wheel, the
      # documented install command.
      #
      # PyPI's index lags the upload, and the release workflow finishes before
      # that. The resolver — not the JSON API — is what has to see the version,
      # so the install itself is retried: asking the JSON API is not the same
      # question, and a green JSON response once hid a failed install.
      - name: Install the published artifact
        run: |
          for _ in $(seq 1 20); do
            if uv tool install "sidekick-agent==${{ steps.version.outputs.version }}"; then
              exit 0
            fi
            echo "the artifact is not resolvable yet; retrying..."
            sleep 30
          done
          echo "::error::the published artifact never became installable"
          exit 1

      - name: The installed version is the published version
        run: |
          got="$($HOME/.local/bin/sk --version | awk '{print $2}')"
          want="${{ steps.version.outputs.version }}"
          if [ "$got" != "$want" ]; then
            echo "::error::installed $got, expected $want"
            exit 1
          fi
          echo "installed $got"

      - name: sk doctor runs
        run: $HOME/.local/bin/sk doctor

      # The greeting fast path needs no model, so this is a real turn with no
      # network and no key: it proves the package runs, not just installs.
      - name: One offline turn
        run: |
          out="$($HOME/.local/bin/sk run 'hi' --json)"
          echo "$out"
          echo "$out" | grep -q '"ok": true' || {
            echo "::error::the offline turn did not succeed"
            exit 1
          }

      # The AUR package is built from this pin. A pin that no longer matches
      # the artifact it names serves an old package to `yay -Syu`.
      #
      # The pin is checked against *its own* version: the question here is
      # "is this pin correct?", not "is this pin the newest?". Keeping it
      # current is a release step (CONTRIBUTING), and the release notes say
      # which version was released.
      - name: The AUR pin matches the artifact it names
        run: python3 packaging/check_aur_pin.py

      - name: Report the result
        run: |
          PIN=$(grep -oP '^pkgver=\K.*' packaging/aur/PKGBUILD)
          {
            echo "## Install smoke test: ${{ steps.version.outputs.version }}"
            echo ""
            echo "- installed from PyPI: yes"
            echo "- sk --version: ${{ steps.version.outputs.version }}"
            echo "- sk doctor: ok"
            echo "- one offline turn: ok"
            echo "- AUR pin (pkgver, source URL, sha256): matches the artifact it names (pin: $PIN)"
          } >> "$GITHUB_STEP_SUMMARY"
