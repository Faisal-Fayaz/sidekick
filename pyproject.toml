[project]
name = "sidekick"
version = "0.1.0"
description = "Local-first terminal companion agent (Ollama-powered)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "textual>=8.0",
    "httpx>=0.27",
]

[project.scripts]
sk = "sk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sk"]
