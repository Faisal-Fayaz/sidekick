[project]
name = "sidekick-agent"
dynamic = ["version"]
description = "Local-first terminal companion agent (Ollama-powered)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
authors = [
    { name = "Faisal01011", email = "fai504438@gmail.com" },
]
maintainers = [
    { name = "Irfanwani", email = "irfanwani347@gmail.com" },
]
keywords = [
    "cli",
    "agent",
    "ollama",
    "llm",
    "tui",
    "terminal",
    "local-first",
    "voice",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "textual>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["faster-whisper"]  # local STT for `sk talk` + TUI mic; install on demand
test = ["pytest>=8.0"]
dev = [
    "build>=1.2",
    "twine>=5.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[project.scripts]
sk = "sk.cli:app"

[project.urls]
Homepage = "https://github.com/Faisal01011/sidekick"
Repository = "https://github.com/Faisal01011/sidekick"
Issues = "https://github.com/Faisal01011/sidekick/issues"
Documentation = "https://github.com/Faisal01011/sidekick/tree/main/README.md"
Changelog = "https://github.com/Faisal01011/sidekick/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sk"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Baseline: E/F/I/UP only. BLE/S/DTZ/PLW intentionally not enabled for now —
# this codebase returns Error strings via broad except (tools.py/agent.py).
# Format gate enabled (repo formatted with `ruff format`).

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP035", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Baseline (see #9): lenient on annotations, strict on hygiene.
# Next toward --strict: disallow_untyped_defs (60 errors), disallow_any_generics.
# CI gate: mypy src/sk/tools src/sk/agent.py src/sk/router.py src/sk/config.py
#   src/sk/store.py src/sk/slash.py src/sk/tui/ src/sk/cli/
disallow_untyped_defs = false
warn_unused_ignores = true
strict_equality = true
no_implicit_reexport = true